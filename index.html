<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Эко Шторы</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* ===== СТИЛИ ===== */
        * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background:#f5f7f0; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:16px; }
        .app { max-width:420px; width:100%; background:white; border-radius:32px; padding:20px 18px 24px; box-shadow:0 8px 30px rgba(0,0,0,0.08); padding-bottom:110px; }
        .discount-banner { background:linear-gradient(135deg,#ff8a00,#f57c00); color:#fff; border-radius:16px; padding:12px 16px; margin-bottom:16px; text-align:center; font-weight:600; font-size:14px; box-shadow:0 4px 12px rgba(245,124,0,0.25); }
        .discount-banner .timer { font-size:20px; font-weight:700; margin-top:4px; letter-spacing:1px; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
        .header h1 { font-size:24px; font-weight:700; color:#1e3a2e; }
        .header .contacts { display:flex; gap:10px; align-items:center; }
        .header .contacts a { text-decoration:none; font-size:20px; line-height:1; display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%; color:white; font-weight:700; transition:transform 0.15s; }
        .header .contacts a:active { transform:scale(0.92); }
        .header .contacts .phone-link { background:#4caf50; font-size:18px; }
        .header .contacts .telegram-link { background:#0088cc; }
        .header .contacts .whatsapp-link { background:#25d366; }
        .tabs { display:flex; gap:6px; margin-bottom:16px; }
        .tab-btn { flex:1; padding:10px 0; border:2px solid #d0d9c9; border-radius:40px; background:#fff; font-weight:600; font-size:14px; color:#1e3a2e; transition:all 0.15s; cursor:pointer; }
        .tab-btn.active { border-color:#2e7d32; background:#e8f5e9; color:#1e3a2e; }
        .tab-content { display:none; }
        .tab-content.active { display:block; }
        .tab-content .desc { font-size:14px; color:#3e4e3e; margin-bottom:12px; line-height:1.4; }
        .field { margin-bottom:12px; }
        .field label { font-weight:500; font-size:14px; color:#1e3a2e; display:block; margin-bottom:4px; }
        .field input, .field textarea { width:100%; padding:12px 16px; border:2px solid #d0d9c9; border-radius:40px; font-size:16px; background:#fff; outline:none; transition:0.2s; font-family:inherit; }
        .field input:focus, .field textarea:focus { border-color:#2e7d32; }
        .field textarea { border-radius:16px; resize:vertical; min-height:60px; }
        .variant-group { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
        .variant-btn { flex:1; min-width:70px; padding:10px 8px; border:2px solid #d0d9c9; border-radius:40px; background:#fff; font-weight:500; font-size:13px; color:#1e3a2e; transition:all 0.15s; cursor:pointer; text-align:center; }
        .variant-btn.active { border-color:#2e7d32; background:#e8f5e9; color:#1e3a2e; }
        .add-to-cart { width:100%; padding:10px; background:#388e3c; color:white; border:none; border-radius:40px; font-size:16px; font-weight:600; cursor:pointer; transition:0.2s; margin:8px 0 4px; }
        .add-to-cart:active { transform:scale(0.96); background:#1e5a22; }
        .cart { position:fixed; bottom:0; left:0; right:0; background:white; box-shadow:0 -4px 20px rgba(0,0,0,0.12); padding:12px 20px 16px; border-radius:24px 24px 0 0; max-width:420px; margin:0 auto; z-index:10; }
        .cart-header { display:flex; justify-content:space-between; align-items:center; font-weight:600; font-size:16px; color:#1e3a2e; cursor:pointer; }
        .cart-items { display:none; margin-top:8px; max-height:200px; overflow-y:auto; font-size:14px; }
        .cart-items.open { display:block; }
        .cart-item { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid #e8f0e2; }
        .cart-total { display:flex; justify-content:space-between; font-weight:700; font-size:16px; margin-top:6px; border-top:2px solid #2e7d32; padding-top:6px; }
        .cart-total .old-total { text-decoration:line-through; font-weight:400; color:#888; font-size:14px; }
        .cart-total .new-total { color:#2e7d32; }
        .checkout-btn { width:100%; padding:12px; background:#2e7d32; color:white; border:none; border-radius:40px; font-size:16px; font-weight:700; cursor:pointer; transition:0.2s; margin-top:8px; }
        .checkout-btn:active { transform:scale(0.96); background:#1e5a22; }
        .clear-cart { background:none; border:none; color:#d32f2f; font-weight:600; font-size:13px; cursor:pointer; }
        .toast { margin-top:12px; padding:10px; border-radius:16px; text-align:center; background:#e8f5e9; color:#1e3a2e; font-weight:500; display:none; }
        .toast.show { display:block; }
        .footer { margin-top:20px; font-size:12px; color:#8a9a8a; text-align:center; border-top:1px solid #e0e8da; padding-top:16px; }
        .footer .contacts-row { display:flex; justify-content:center; gap:16px; margin:8px 0; }
        .footer .contacts-row a { text-decoration:none; font-size:20px; line-height:1; display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:50%; color:white; font-weight:700; transition:transform 0.15s; }
        .footer .contacts-row a:active { transform:scale(0.92); }
        .footer .contacts-row .phone-link { background:#4caf50; font-size:18px; }
        .footer .contacts-row .telegram-link { background:#0088cc; }
        .footer .contacts-row .whatsapp-link { background:#25d366; }
        .hidden { display:none !important; }
        /* ===== КОНЕЦ СТИЛЕЙ ===== */
    </style>
</head>
<body>
<div class="app">
    <!-- Баннер скидки -->
    <div class="discount-banner">
        🎉 Скидка 20% на первый заказ через приложение!
        <div class="timer" id="timer">-- : -- : --</div>
    </div>

    <!-- Шапка -->
    <div class="header">
        <h1>Эко Шторы</h1>
        <div class="contacts">
            <a href="tel:+79890464845" class="phone-link">📞</a>
            <a href="https://t.me/ecoshtory_ru" target="_blank" class="telegram-link">T</a>
            <a href="https://wa.me/79890464845" target="_blank" class="whatsapp-link">W</a>
        </div>
    </div>

    <!-- Вкладки -->
    <div class="tabs" id="tabs">
        <button class="tab-btn active" data-tab="0">Шторы</button>
        <button class="tab-btn" data-tab="1">Мебель</button>
        <button class="tab-btn" data-tab="2">Ковры</button>
    </div>

    <!-- Контейнер вкладок -->
    <div id="tabContainer"></div>

    <!-- Корзина -->
    <div class="cart" id="cart">
        <div class="cart-header" id="cartHeader">
            <span>🛒 Корзина (<span id="cartCount">0</span>)</span>
            <span id="cartArrow">▼</span>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-total" id="cartTotal">
            <span>Итого:</span>
            <span><span class="old-total" id="cartOldTotal">0 ₽</span> <span class="new-total" id="cartNewTotal">0 ₽</span></span>
        </div>
        <button class="checkout-btn" id="checkoutBtn">Оформить заказ</button>
    </div>

    <!-- Футер -->
    <div class="footer">
        <div class="contacts-row">
            <a href="tel:+79890464845" class="phone-link">📞</a>
            <a href="https://t.me/ecoshtory_ru" target="_blank" class="telegram-link">T</a>
            <a href="https://wa.me/79890464845" target="_blank" class="whatsapp-link">W</a>
        </div>
        © Эко Шторы — забота о вашем текстиле
    </div>
</div>

<script>
    // ============================================================
    //  НАСТРОЙКИ
    // ============================================================
    const SERVICES = {
        'Шторы': {
            type: 'catalog',
            categories: {
                'Шторы': {
                    variants: {
                        'Синтетика': 320,
                        'Натуральные ткани': 350,
                        'Шелковые': 400
                    }
                }
            },
            desc: 'Деликатная химчистка штор из любых тканей. Снятие и установка входят в стоимость. Выезд по Москве и области.',
            showArea: true,
            commentPlaceholder: 'Например: высота 9 метров, сложный карниз...'
        },
        'Мебель': {
            type: 'catalog',
            categories: {
                'Диваны': {
                    variants: {
                        '2-местный': 3000,
                        '3-местный': 4000,
                        'Угловой': 5500,
                        'Модульный': 7000
                    }
                },
                'Кресла': {
                    variants: {
                        'Обычное': 1000,
                        'Офисное': 1500,
                        'С мягкой обивкой': 2000
                    }
                },
                'Стулья': {
                    variants: {
                        'Обычный': 300,
                        'С подлокотниками': 500,
                        'Барный': 800
                    }
                },
                'Матрасы': {
                    variants: {
                        'Односпальный': 1500,
                        'Двуспальный': 2500,
                        'Детский': 1000
                    }
                }
            },
            desc: 'Чистка мягкой мебели любых типов. Удаляем пятна, запахи, освежаем цвет. Безопасные эко-средства.',
            showArea: false,
            commentPlaceholder: 'Степень загрязнения, тип ткани, особые пожелания...'
        },
        'Ковры': {
            type: 'per_m',
            price: 650,
            desc: 'Глубокая чистка ковров и ковровых покрытий любых размеров. Эко-средства, бережный уход, быстрая сушка.',
            showArea: true,
            commentPlaceholder: 'Степень загрязнения, материал (шерсть, синтетика), особые пожелания...'
        }
    };

    const CONTACTS = {
        phone: '+79890464845',
        telegram: 'ecoshtory_ru',
        whatsapp: '79890464845'
    };
    // ============================================================

    const tabContainer = document.getElementById('tabContainer');
    const tabs = document.querySelectorAll('.tab-btn');
    const cartItems = document.getElementById('cartItems');
    const cartCount = document.getElementById('cartCount');
    const cartOldTotal = document.getElementById('cartOldTotal');
    const cartNewTotal = document.getElementById('cartNewTotal');
    const cartHeader = document.getElementById('cartHeader');
    const cartArrow = document.getElementById('cartArrow');
    const checkoutBtn = document.getElementById('checkoutBtn');
    const timerEl = document.getElementById('timer');

    let currentTab = 0;
    let cart = [];
    const discountPercent = 20;

    // Таймер
    const endDate = new Date(Date.now() + (5 * 24 - 26) * 3600 * 1000);
    function updateTimer() {
        const diff = endDate - Date.now();
        if (diff <= 0) { timerEl.textContent = 'Акция завершена'; return; }
        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
        const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((diff % (1000 * 60)) / 1000);
        timerEl.textContent = `${d} дн. ${h} ч. ${m} мин. ${s} сек.`;
    }
    setInterval(updateTimer, 1000);
    updateTimer();

    // ===== РЕНДЕРИНГ ВКЛАДОК (исправлен) =====
    function renderTabs() {
        const serviceNames = Object.keys(SERVICES);
        let html = '';

        serviceNames.forEach((name, idx) => {
            const active = (idx === currentTab) ? 'active' : '';
            const service = SERVICES[name];

            html += `<div class="tab-content ${active}" data-index="${idx}">`;
            html += `<div class="desc">${service.desc}</div>`;

            // ---- КАТАЛОГ (для штор и мебели) ----
            if (service.type === 'catalog') {
                const catKeys = Object.keys(service.categories);
                catKeys.forEach(catName => {
                    const variants = service.categories[catName].variants;
                    const variantNames = Object.keys(variants);

                    html += `<div style="margin-bottom:12px;"><strong>${catName}</strong>`;
                    html += `<div class="variant-group" data-category="${catName}" data-index="${idx}">`;

                    variantNames.forEach(vName => {
                        const price = variants[vName];
                        html += `<button class="variant-btn" data-variant="${vName}" data-price="${price}" data-category="${catName}" data-index="${idx}">${vName}<br/><small>${price} ₽</small></button>`;
                    });

                    html += `</div></div>`;
                });
            }

            // ---- ПЛОЩАДЬ ----
            if (service.showArea) {
                html += `<div class="field"><label for="area_${idx}">Площадь (м²)</label><input type="number" id="area_${idx}" placeholder="Например, 5" min="0" step="0.1" class="area-input" data-index="${idx}" /></div>`;
            } else {
                html += `<input type="hidden" id="area_${idx}" value="1" class="area-input" data-index="${idx}" />`;
            }

            // ---- ТЕЛЕФОН И КОММЕНТАРИЙ ----
            html += `<div class="field"><label for="phone_${idx}">Ваш телефон *</label><input type="tel" id="phone_${idx}" placeholder="+7 (999) 123-45-67" class="phone-input" data-index="${idx}" /></div>`;
            html += `<div class="field"><label for="comment_${idx}">Комментарий</label><textarea id="comment_${idx}" placeholder="${service.commentPlaceholder}" class="comment-input" data-index="${idx}"></textarea></div>`;

            html += `<button class="add-to-cart" data-index="${idx}">Добавить в корзину</button>`;
            html += `</div>`;
        });

        tabContainer.innerHTML = html;

        // ---- ОБРАБОТЧИКИ ----
        // Клик по варианту
        document.querySelectorAll('.variant-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const parent = this.closest('.variant-group');
                if (parent) {
                    parent.querySelectorAll('.variant-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                }
            });
        });

        // Автовыбор первого варианта в каждой группе
        document.querySelectorAll('.variant-group').forEach(group => {
            const first = group.querySelector('.variant-btn');
            if (first) first.classList.add('active');
        });

        // Кнопка "Добавить в корзину"
        document.querySelectorAll('.add-to-cart').forEach(btn => {
            btn.addEventListener('click', function() {
                const idx = parseInt(this.dataset.index, 10);
                addToCart(idx);
            });
        });

        updateCartUI();
    }

    // ===== ДОБАВИТЬ В КОРЗИНУ =====
    function addToCart(index) {
        const serviceNames = Object.keys(SERVICES);
        const serviceName = serviceNames[index];
        const service = SERVICES[serviceName];
        const areaInput = document.getElementById(`area_${index}`);
        let area = parseFloat(areaInput ? areaInput.value : 1) || 1;

        if (!service.showArea) {
            area = 1;
        } else if (area <= 0) {
            showToast('⚠️ Введите площадь (больше 0)');
            return;
        }

        let variant = null;
        let price = 0;
        let category = '';

        if (service.type === 'catalog') {
            const activeVariant = document.querySelector(`.variant-btn.active[data-index="${index}"]`);
            if (!activeVariant) {
                showToast('⚠️ Выберите тип услуги');
                return;
            }
            variant = activeVariant.dataset.variant;
            price = parseFloat(activeVariant.dataset.price);
            category = activeVariant.dataset.category;
        } else if (service.type === 'per_m') {
            variant = 'Стандарт';
            price = service.price;
            category = 'Ковры';
        }

        cart.push({
            service: serviceName,
            category: category,
            variant: variant,
            area: area,
            price: price,
            total: area * price
        });

        showToast(`✅ Добавлено: ${serviceName} (${variant})`);
        updateCartUI();
    }

    // ===== ОБНОВЛЕНИЕ КОРЗИНЫ =====
    function updateCartUI() {
        const count = cart.length;
        cartCount.textContent = count;

        if (count === 0) {
            cartItems.innerHTML = '<div style="text-align:center;color:#8a9a8a;padding:8px 0;">Корзина пуста</div>';
            cartOldTotal.textContent = '0 ₽';
            cartNewTotal.textContent = '0 ₽';
            return;
        }

        let html = '';
        let total = 0;
        cart.forEach((item, idx) => {
            total += item.total;
            html += `<div class="cart-item">
                <span>${item.service} (${item.variant}) — ${item.area} м²</span>
                <span>${item.total.toFixed(0)} ₽ <button class="clear-cart" data-idx="${idx}" style="font-size:12px;">✕</button></span>
            </div>`;
        });
        cartItems.innerHTML = html;

        const discount = total * (discountPercent / 100);
        const newTotal = total - discount;

        cartOldTotal.textContent = total.toFixed(0) + ' ₽';
        cartNewTotal.textContent = newTotal.toFixed(0) + ' ₽';

        document.querySelectorAll('.clear-cart').forEach(btn => {
            btn.addEventListener('click', function() {
                const idx = parseInt(this.dataset.idx, 10);
                cart.splice(idx, 1);
                updateCartUI();
                showToast('🗑️ Удалено из корзины');
            });
        });
    }

    // ===== УВЕДОМЛЕНИЕ =====
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.background = '#e8f5e9';
        toast.style.color = '#1e3a2e';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ===== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК =====
    tabs.forEach((btn, idx) => {
        btn.addEventListener('click', function() {
            tabs.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentTab = idx;
            document.querySelectorAll('.tab-content').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
            });
        });
    });

    // ===== РАСКРЫТИЕ КОРЗИНЫ =====
    let cartOpen = false;
    cartHeader.addEventListener('click', function() {
        cartOpen = !cartOpen;
        cartItems.classList.toggle('open', cartOpen);
        cartArrow.textContent = cartOpen ? '▲' : '▼';
    });

    // ===== ОФОРМЛЕНИЕ ЗАКАЗА =====
    checkoutBtn.addEventListener('click', function() {
        if (cart.length === 0) {
            showToast('⚠️ Корзина пуста. Добавьте услуги.');
            return;
        }

        const phoneInput = document.querySelector(`.phone-input[data-index="${currentTab}"]`);
        const phone = phoneInput ? phoneInput.value : '';
        if (!phone || phone.length < 5) {
            showToast('⚠️ Введите номер телефона');
            return;
        }

        const commentInput = document.querySelector(`.comment-input[data-index="${currentTab}"]`);
        const comment = commentInput ? commentInput.value : '';

        let total = 0;
        let details = '';
        cart.forEach(item => {
            total += item.total;
            details += `${item.service} (${item.variant}) — ${item.area} м² = ${item.total.toFixed(0)} ₽\n`;
        });

        const discount = total * (discountPercent / 100);
        const newTotal = total - discount;

        let message = `Новая заявка из приложения Эко Шторы\n\n`;
        message += `📋 Услуги:\n${details}\n`;
        message += `📞 Телефон: ${phone}\n`;
        if (comment.trim()) message += `💬 Комментарий: ${comment}\n`;
        message += `💰 Итого без скидки: ${total.toFixed(0)} ₽\n`;
        message += `🎉 Скидка 20%: -${discount.toFixed(0)} ₽\n`;
        message += `✅ Итого к оплате: ${newTotal.toFixed(0)} ₽`;

        const subject = 'Новая заявка из Эко Шторы (несколько услуг)';
        const mailtoLink = `mailto:ecoshtory@yandex.ru?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(message)}`;
        window.location.href = mailtoLink;

        showToast('📧 Открывается почта... Отправьте письмо');
    });

    // ===== ЗАПУСК =====
    renderTabs();

    // Создаём toast (если его нет)
    if (!document.getElementById('toast')) {
        const toast = document.createElement('div');
        toast.id = 'toast';
        toast.className = 'toast';
        document.querySelector('.app').appendChild(toast);
    }
</script>
</body>
</html>
