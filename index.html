<!DOCTYPE html>
<html lang="ru">
<head>https://saap771-source.github.io/ecoshtory-app/
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Эко Шторы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f5f7f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .app {
            max-width: 400px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 24px 20px 32px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1e3a2e;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h1 span {
            background: #2e7d32;
            color: white;
            font-size: 14px;
            padding: 2px 12px;
            border-radius: 30px;
        }
        .sub {
            color: #5a6b5a;
            font-size: 14px;
            margin-top: -4px;
            margin-bottom: 24px;
        }
        .service-block {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .service-btn {
            flex: 1;
            min-width: 80px;
            padding: 12px 0;
            border: 2px solid #d0d9c9;
            border-radius: 40px;
            background: white;
            font-weight: 600;
            font-size: 16px;
            color: #1e3a2e;
            transition: all 0.15s;
            cursor: pointer;
        }
        .service-btn.active {
            border-color: #2e7d32;
            background: #e8f5e9;
            color: #1e3a2e;
        }
        .service-btn:active {
            transform: scale(0.95);
        }
        .field {
            margin-bottom: 16px;
        }
        .field label {
            font-weight: 500;
            font-size: 14px;
            color: #1e3a2e;
            display: block;
            margin-bottom: 4px;
        }
        .field input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #d0d9c9;
            border-radius: 40px;
            font-size: 16px;
            background: white;
            outline: none;
            transition: 0.2s;
        }
        .field input:focus {
            border-color: #2e7d32;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            background: #f0f5ec;
            padding: 14px 18px;
            border-radius: 40px;
            margin: 8px 0 20px;
        }
        .price-row .label {
            font-weight: 500;
            color: #1e3a2e;
        }
        .price-row .value {
            font-size: 22px;
            font-weight: 700;
            color: #1e3a2e;
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
        }
        .btn-submit:active {
            transform: scale(0.96);
            background: #1e5a22;
        }
        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #8a9a8a;
            text-align: center;
        }
        .toast {
            margin-top: 16px;
            padding: 12px;
            border-radius: 20px;
            text-align: center;
            background: #e8f5e9;
color: #1e3a2e;
            font-weight: 500;
            display: none;
        }
        .toast.show {
            display: block;
        }
    </style>
</head>
<body>
<div class="app">
    <h1>Эко Шторы <span>химчистка</span></h1>
    <div class="sub">Заказ с выездом на дом</div>

    <div class="service-block" id="serviceBlock">
        <button class="service-btn" data-service="Шторы" data-price="500">Шторы</button>
        <button class="service-btn" data-service="Мебель" data-price="700">Мебель</button>
        <button class="service-btn" data-service="Ковры" data-price="400">Ковры</button>
    </div>

    <div class="field">
        <label for="area">Площадь (м²)</label>
        <input type="number" id="area" placeholder="Например, 5" min="0" step="0.1">
    </div>

    <div class="price-row">
        <span class="label">Итого:</span>
        <span class="value" id="totalPrice">0 ₽</span>
    </div>

    <button class="btn-submit" id="submitBtn">Оставить заявку</button>

    <div class="toast" id="toast">✅ Заявка отправлена! Мы свяжемся с вами.</div>
    <div class="footer">© Эко Шторы — забота о вашем текстиле</div>
</div>

<script>
    (function() {
        // Данные
        let selectedService = 'Шторы';
        let selectedPrice = 500;

        // Элементы
        const serviceBtns = document.querySelectorAll('.service-btn');
        const areaInput = document.getElementById('area');
        const totalPriceEl = document.getElementById('totalPrice');
        const submitBtn = document.getElementById('submitBtn');
        const toast = document.getElementById('toast');

        // Выбор услуги
        serviceBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                serviceBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedService = this.dataset.service;
                selectedPrice = parseInt(this.dataset.price, 10);
                updateTotal();
            });
        });
        // По умолчанию выбрать первую
        serviceBtns[0].classList.add('active');

        // Обновление цены
        function updateTotal() {
            const area = parseFloat(areaInput.value) || 0;
            const total = area * selectedPrice;
            totalPriceEl.textContent = total.toFixed(0) + ' ₽';
        }

        areaInput.addEventListener('input', updateTotal);
        updateTotal();

        // Отправка заявки
        submitBtn.addEventListener('click', function() {
            const area = parseFloat(areaInput.value) || 0;
            if (area <= 0) {
                toast.textContent = '⚠️ Введите площадь (больше 0)';
                toast.style.background = '#fff3e0';
                toast.style.color = '#e65100';
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
                return;
            }

            const total = area * selectedPrice;
            const message = `Услуга: ${selectedService}\nПлощадь: ${area} м²\nСтоимость: ${total} ₽`;
            const subject = 'Новая заявка из Эко Шторы';

            // Отправка через mailto
            const mailtoLink = `mailto:ecoshtory@yandex.ru?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(message)}`;
            window.location.href = mailtoLink;

            // Показываем уведомление
            toast.textContent = '📧 Открывается почта... Отправьте письмо';
            toast.style.background = '#e8f5e9';
            toast.style.color = '#1e3a2e';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 5000);
        });
    })();
</script>
</body>
</html>
